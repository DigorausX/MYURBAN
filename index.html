<script>
        const SHEET_ID = "1ZNHNl1V0BWoYG3pdRUr18pXUEEw6BVXPxjcVRKU1fmw";
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
        const BASE_TMD_URL = "http://www.rnd.tmd.go.th/api/hidxbc/";

        // ฟังก์ชันช่วยสลับ Proxy อัตโนมัติถ้าตัวแรกตาย
        function getProxyUrl(url, attempt = 1) {
            const encodedUrl = encodeURIComponent(url);
            if (attempt === 1) return "https://corsproxy.io/?" + encodedUrl;
            if (attempt === 2) return "https://api.codetabs.com/v1/proxy?quest=" + encodedUrl;
            return "https://api.allorigins.win/raw?url=" + encodedUrl;
        }

        function addLog(msg) {
            const logDiv = document.getElementById('log');
            logDiv.style.display = 'block';
            logDiv.innerText += msg + "\n";
            console.log(msg);
        }

        function formatDate() {
            const d = new Date();
            let year = d.getFullYear();
            let month = ('' + (d.getMonth() + 1)).padStart(2, '0');
            let day = ('' + d.getDate()).padStart(2, '0');
            return { 
                fileDate: `${year}${month}${day}`, 
                reportDate: `${day}/${month}/${year}` 
            };
        }

        async function fetchData() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result-area').style.display = 'none';
            document.getElementById('log').innerText = "";
            
            const dates = formatDate();
            // dates.fileDate = "20260904"; // เอาคอมเมนต์ออกถ้าจะล็อกวันเทส
            
            try {
                // =========================================================
                // 1. เข้าไปกวาดหารายชื่อไฟล์แบบ BeautifulSoup
                // =========================================================
                addLog(`🔍 กำลังค้นหาไฟล์ของวันที่ ${dates.fileDate} ในโฟลเดอร์กรมอุตุฯ...`);
                
                let indexHtml = "";
                let fetchSuccess = false;
                
                // ลองดึงข้อมูลโดยใช้ Proxy สำรอง 3 ชั้น
                for (let i = 1; i <= 3; i++) {
                    try {
                        const proxyIndexUrl = getProxyUrl(BASE_TMD_URL, i);
                        const indexResponse = await fetch(proxyIndexUrl);
                        if (!indexResponse.ok) throw new Error("HTTP " + indexResponse.status);
                        indexHtml = await indexResponse.text();
                        fetchSuccess = true;
                        break; // ดึงสำเร็จให้ออกจากลูป
                    } catch (e) {
                        addLog(`⚠️ Proxy ตัวที่ ${i} ไม่ตอบสนอง กำลังลองตัวสำรอง...`);
                    }
                }

                if (!fetchSuccess) {
                    throw new Error("เซิร์ฟเวอร์ Proxy ฟรีถูกบล็อกทั้งหมด กรุณาลองใหม่ภายหลัง หรือปิด Ad-Blocker บนเบราว์เซอร์");
                }
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(indexHtml, 'text/html');
                const links = doc.querySelectorAll('a');
                
                let targetFileName = null;
                for (let link of links) {
                    let href = link.getAttribute('href');
                    if (href && href.includes(dates.fileDate) && href.endsWith('.csv')) {
                        targetFileName = href;
                        break;
                    }
                }

                if (!targetFileName) {
                    throw new Error(`ไม่พบไฟล์ CSV ของวันที่ ${dates.reportDate} บนหน้าเว็บกรมอุตุฯ`);
                }
                
                const finalTmdUrl = BASE_TMD_URL + targetFileName;
                addLog(`✅ พบไฟล์เป้าหมาย: ${targetFileName}`);

                // =========================================================
                // 2. โหลดข้อมูล G-Sheets (รายชื่อสถานี)
                // =========================================================
                addLog("📥 กำลังดึงรายชื่อสถานีจาก Google Sheets...");
                const proxySheetUrl = getProxyUrl(SHEET_URL, 1);
                const sheetData = await new Promise((resolve, reject) => {
                    Papa.parse(proxySheetUrl, {
                        download: true, header: true,
                        complete: results => resolve(results.data),
                        error: err => reject("ดึงชีตไม่สำเร็จ: " + err)
                    });
                });

                const bkkStations = sheetData.filter(row => row.Province === "กรุงเทพมหานคร");
                const bkkStationIds = bkkStations.map(row => row.WmoStationNumber);
                if (bkkStationIds.length === 0) throw new Error("ไม่พบรายชื่อสถานีกรุงเทพฯ");

                // =========================================================
                // 3. โหลดข้อมูล CSV ของกรมอุตุฯ 
                // =========================================================
                addLog("📥 กำลังดึงข้อมูลพยากรณ์จากไฟล์ CSV...");
                const proxyTmdUrl = getProxyUrl(finalTmdUrl, 1);
                const tmdData = await new Promise((resolve, reject) => {
                    Papa.parse(proxyTmdUrl, {
                        download: true, header: false,
                        complete: results => resolve(results.data),
                        error: err => reject("ดึงข้อมูลอุตุฯ ไม่สำเร็จ: " + err)
                    });
                });

                // =========================================================
                // 4. ประมวลผลหาค่าสูงสุด
                // =========================================================
                addLog("⚙️ กำลังประมวลผลคำนวณหาจุดที่ร้อนที่สุด...");
                let maxHi = -999;
                let hottestStationName = "";

                tmdData.forEach(row => {
                    if (row[0] && bkkStationIds.includes(row[0].toString())) {
                        let stationMax = -999;
                        for (let i = 3; i < row.length; i++) {
                            let val = parseFloat(row[i]);
                            if (!isNaN(val) && val > stationMax) {
                                stationMax = val;
                            }
                        }
                        if (stationMax > maxHi) {
                            maxHi = stationMax;
                            let match = bkkStations.find(s => s.WmoStationNumber === row[0].toString());
                            if(match) hottestStationName = match.StationNameThai;
                        }
                    }
                });

                if (maxHi === -999) throw new Error("ไฟล์อัปโหลดแล้ว แต่ไม่มีข้อมูลพิกัด กทม. ในไฟล์");

                addLog("🎉 ประมวลผลสำเร็จ!");
                renderResult(maxHi, hottestStationName, dates.reportDate);

            } catch (error) {
                alert("เกิดข้อผิดพลาด: \n" + error);
                addLog("❌ " + error);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderResult(maxHi, stationName, dateStr) {
            let level, icon, img, bgColor, textColor;

            if (maxHi >= 27.0 && maxHi <= 32.9) {
                level = "เฝ้าระวัง"; icon = "🟢"; img = "1.jpg"; bgColor = "#e8f5e9"; textColor = "#2e7d32";
            } else if (maxHi >= 33.0 && maxHi <= 41.9) {
                level = "เตือนภัย"; icon = "🟡"; img = "2.jpg"; bgColor = "#fff8e1"; textColor = "#f57f17";
            } else if (maxHi >= 42.0 && maxHi <= 51.9) {
                level = "อันตราย"; icon = "🟠"; img = "3.jpg"; bgColor = "#fff3e0"; textColor = "#e65100";
            } else if (maxHi >= 52.0) {
                level = "อันตรายมาก"; icon = "🔴"; img = "4.jpg"; bgColor = "#ffebee"; textColor = "#c62828";
            } else {
                level = "ปกติ"; icon = "🔵"; img = "-"; bgColor = "#e3f2fd"; textColor = "#1565c0";
            }

            const statusBox = document.getElementById('status-display');
            statusBox.style.backgroundColor = bgColor;
            statusBox.style.color = textColor;
            statusBox.innerHTML = `HI สูงสุด: ${maxHi.toFixed(1)} °C<br><span style="font-size:0.8em">สถานีจุดพีก: ${stationName}</span>`;

            document.getElementById('img-suggestion').innerText = `👉 นำข้อความด้านบนไปโพสต์คู่กับไฟล์ภาพ: ${img}`;

            const reportMsg = `📣 แจ้งเตือน!! ค่าดัชนีความร้อน (Heat Index)
ประจำวันที่ ${dateStr}
.
📍 ค่าดัชนีความร้อน (Heat Index) อยู่ในเกณฑ์ 
"${level}" ${icon}

👱 บุคคลทั่วไป : สังเกตอาการตนเอง
👶 👵 🤰 😷 กลุ่มเสี่ยง : 
หากมีอาการผิดปกติให้รีบพบแพทย์
.
🔎 สามารถติดตามการรายงานสถานการณ์คุณภาพอากาศได้ที่เว็บไซต์ airbkk.com และแอปพลิเคชัน AirBKK`;

            document.getElementById('report-text').value = reportMsg;
            document.getElementById('result-area').style.display = 'block';
        }
    </script>
